project:
  type: book
  post-render:
    - python3 fix_docx.py

book:
  title: "Выпускная квалификационная работа"
  author: "Устинов И. А., БИСО-01-21"
  chapters:
    - index.qmd
    - chapters/intro/intro.qmd
    - chapters/chapter1/chapter1.qmd
    - chapters/chapter2/chapter2.qmd
    - chapters/chapter3/chapter3.qmd
    - chapters/ending/ending.qmd
    - references/references.qmd
  appendices:
    - chapters/chapter3/appendices/appendix_listings.qmd
    
mainfont: "Times New Roman"

crossref:
  fig-title: "Рисунок"
  fig-prefix: "рис."
  tbl-title: "Таблица"
  tbl-prefix: "табл."
  sec-prefix: "Приложение"
  title-delim: "\u00a0–"
  eq-prefix: ""

format:
  html:
    theme: cosmo
    toc: true
    toc-title: "СОДЕРЖАНИЕ"
    number-sections: true
    number-depth: 4
  pdf:
    documentclass: extreport
    fontsize: 14pt
    papersize: a4
    toc: true
    toc-title: "Содержание"
    number-sections: true
    pdf-engine: xelatex
    mainfont: "Times New Roman"
    monofont: "Courier New"
    highlight-style: none
    geometry:
      - left=30mm
      - right=15mm
      - top=20mm
      - bottom=20mm
    include-in-header: gost.tex
  docx:
    toc: true
    toc-title: "Содержание"
    number-sections: true
    highlight-style: none
    reference-doc: doc-reference.docx
    fig-align: center
bibliography: references/references.bib
csl: references/gost-r-7-0-5-2008-numeric.csl
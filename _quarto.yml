lang: ru
mainfont: "Times New Roman"

crossref:
  fig-title: "Рисунок"
  fig-prefix: "рис."
  tbl-title: "Таблица"
  tbl-prefix: "табл."
  title-delim: " — "
  eq-prefix: ""

format:
  html:
    theme: cosmo
    toc: true
    toc-title: "СОДЕРЖАНИЕ"
    number-sections: true
    number-depth: 4
  pdf:
    documentclass: extreport
    fontsize: 14pt
    papersize: a4
    toc: true
    toc-title: "Содержание"
    number-sections: true
    pdf-engine: xelatex
    mainfont: "Times New Roman"
    monofont: "Courier New"
    highlight-style: none
    geometry:
      - left=30mm
      - right=15mm
      - top=20mm
      - bottom=20mm
    include-in-header: gost.tex
  docx:
    toc: true
    toc-title: "Содержание"
    number-sections: true
    highlight-style: none
    fig-align: center
    reference-doc: gost-template.docx

bibliography: references/references.bib
csl: references/gost-r-7-0-5-2008-numeric.csl
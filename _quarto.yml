  appendices:
    - chapters/chapter3/appendices/appendix_ip_script.qmd
    - chapters/chapter3/appendices/appendix_ml_constants.qmd
    - chapters/chapter3/appendices/appendix_ml_collector.qmd
    - chapters/chapter3/appendices/appendix_ml_helpers.qmd
    - chapters/chapter3/appendices/appendix_ml_trainer.qmd
    - chapters/chapter3/appendices/appendix_ml_checker.qmd
    - chapters/chapter3/appendices/appendix_api_index.qmd
    - chapters/chapter3/appendices/appendix_api_checkAuth.qmd
    - chapters/chapter3/appendices/appendix_api_mainAuth.qmd
    - chapters/chapter3/appendices/appendix_api_queryDb.qmd
    - chapters/chapter3/appendices/appendix_api_vpnConf.qmd
    - chapters/chapter3/appendices/appendix_api_userEntryControl.qmd
    - chapters/chapter3/appendices/appendix_api_userDependControl.qmd
    - chapters/chapter3/appendices/appendix_api_userNotificationControl.qmd
    - chapters/chapter3/appendices/appendix_api_userControl.qmd
    - chapters/chapter3/appendices/appendix_api_blockListControl.qmd
